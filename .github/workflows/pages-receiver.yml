# Canonical receiver: provider data remains a verified short-lived artifact, not a Git snapshot.
name: Validate or deploy ephemeral Pages candidate

on:
  push:
    branches: [main]
    paths: ['.github/pages-delivery.json']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful trusted private producer workflow run ID
        required: true
        type: string
      source_sha:
        description: Exact reviewed 40-character private source commit
        required: true
        type: string
      mode:
        description: Manual validate or approved disabled deployment
        type: choice
        options: [validate, deploy]
        default: validate
        required: true

permissions:
  contents: read

concurrency:
  group: ephemeral-pages-receiver
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'winterinabluu/kpop-pulse-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact delivery and trusted receiver code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Resolve trusted source run and artifact
        id: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
          TRIGGER_EVENT: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_METADATA: ${{ runner.temp }}/pages-source-metadata
        run: |
          if [ "$TRIGGER_EVENT" = "push" ]; then
            python -B .github/scripts/pages_delivery.py resolve --delivery .github/pages-delivery.json --output-dir "$SOURCE_METADATA"
          else
            python -B .github/scripts/pages_delivery.py resolve --run-id "$SOURCE_RUN_ID" --sha "$SOURCE_SHA" --output-dir "$SOURCE_METADATA"
          fi
      - name: Download exact private artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
          repository: winterinabluu/kpop-pulse
          run-id: ${{ steps.source.outputs.source_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pages-received
      - name: Verify identity, expiry, inventory and disabled YouTube
        env:
          RECEIVED_BUNDLE: ${{ runner.temp }}/pages-received
          SOURCE_METADATA: ${{ runner.temp }}/pages-source-metadata
        run: |
          python -B .github/scripts/verify_pages_candidate.py --bundle "$RECEIVED_BUNDLE" --run-metadata "$SOURCE_METADATA/run.json" --artifact-metadata "$SOURCE_METADATA/artifact.json"
          if [ -f "$SOURCE_METADATA/delivery.json" ]; then
            python -B .github/scripts/pages_delivery.py check --delivery "$SOURCE_METADATA/delivery.json" --manifest "$RECEIVED_BUNDLE/manifest.json"
          fi
      - name: Prepare one-day GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-received/site
          retention-days: 1

  deploy:
    if: vars.EPHEMERAL_PAGES_APPROVED == 'true' && (github.event_name == 'push' || inputs.mode == 'deploy')
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy already verified disabled artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
