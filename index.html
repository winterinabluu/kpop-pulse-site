<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kpop Pulse 追踪 Kpop 女团相关新闻和已验证内容更新。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Kpop Pulse</title>
    <link rel="stylesheet" href="./src/styles.css?v=20260812a" />
    <script type="module" src="./src/app.js?v=20260812a"></script>
  </head>
  <body>
    <noscript>Kpop Pulse 需要启用 JavaScript 才能读取本地数据并渲染内容列表。</noscript>
    <div id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Kpop Pulse · Alpha</p>
          <h1>女团更新追踪</h1>
          <p id="tracking-copy" class="lede">追踪已配置女团的相关新闻和已验证链接，每条内容都标明来源与匹配依据。</p>
        </div>
        <div id="freshness" class="freshness" aria-live="polite">读取数据中...</div>
      </header>

      <main>
        <section class="toolbar" aria-label="筛选条件">
          <div class="toolbar-row">
            <label class="search-label" for="search-input">搜索</label>
            <input id="search-input" type="search" placeholder="搜索标题、来源、组合或成员" />
            <select id="sort-select" aria-label="排序">
              <option value="latest">最新发布</option>
              <option value="confidence">匹配置信度</option>
            </select>
          </div>
          <button
            id="advanced-filters-toggle"
            class="advanced-filter-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="advanced-filters"
          >筛选与偏好</button>
          <div id="advanced-filters" class="advanced-filters is-collapsed">
            <div class="filter-group">
              <span class="filter-title">团体</span>
              <div id="group-filters" class="chip-row" role="group" aria-label="团体筛选"></div>
            </div>
            <div class="filter-group">
              <span class="filter-title">成员</span>
              <div id="member-filter-panel" class="member-filter-panel">
                <div class="member-mode-row">
                  <div class="mode-switch" role="group" aria-label="成员筛选模式">
                    <button id="member-mode-include" class="mode-button" type="button" aria-pressed="true">只看</button>
                    <button id="member-mode-mute" class="mode-button" type="button" aria-pressed="false">屏蔽</button>
                  </div>
                  <span id="muted-member-summary" class="filter-note" aria-live="polite">未屏蔽成员</span>
                  <button id="clear-muted-members" class="ghost-button compact-button" type="button" hidden>清除屏蔽</button>
                </div>
                <div id="member-filters" class="chip-row" role="group" aria-label="成员筛选"></div>
              </div>
            </div>
            <div class="filter-group">
              <span class="filter-title">来源</span>
              <div id="platform-filters" class="chip-row" role="group" aria-label="来源筛选"></div>
            </div>
            <div class="filter-group">
              <span class="filter-title">质量</span>
              <div id="quality-filters" class="chip-row" role="group" aria-label="质量筛选"></div>
            </div>
          </div>
        </section>

        <section class="summary-grid" aria-label="数据摘要">
          <article class="summary-card">
            <span class="summary-label">当前结果</span>
            <strong id="summary-count">0</strong>
          </article>
          <article class="summary-card">
            <span class="summary-label">当前来源</span>
            <strong id="summary-sources">0</strong>
          </article>
          <article class="summary-card">
            <span class="summary-label">最新内容</span>
            <strong id="summary-latest">—</strong>
          </article>
        </section>

        <section id="status-banner" class="status-banner" aria-live="polite"></section>

        <section id="youtube-consent" class="youtube-consent" aria-labelledby="youtube-consent-title" hidden>
          <div>
            <p class="eyebrow">YouTube API</p>
            <h2 id="youtube-consent-title">是否显示 YouTube 内容？</h2>
            <p>本站会读取公开的官方视频资料。继续前，请先阅读隐私说明和使用条款；不同意不会影响新闻内容。</p>
          </div>
          <label class="consent-check" for="youtube-consent-check">
            <input id="youtube-consent-check" type="checkbox" />
            <span>我已阅读并同意 <a href="./privacy.html">隐私说明</a>和<a href="./terms.html">使用条款</a>。</span>
          </label>
          <button id="youtube-consent-accept" class="consent-button" type="button" disabled>同意并显示 YouTube 内容</button>
        </section>

        <section class="feed-section" aria-labelledby="feed-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Alpha</p>
              <h2 id="feed-title">最新内容</h2>
            </div>
            <button id="clear-filters" class="ghost-button" type="button">清空筛选</button>
          </div>
          <div id="feed" class="feed" aria-live="polite"></div>
          <button id="load-more" class="load-more-button" type="button" aria-controls="feed" hidden>显示更多</button>
          <div id="empty-state" class="empty-state" hidden>
            <h3>当前条件没有匹配内容</h3>
            <p>换一个团体、成员、来源，或清空搜索词。</p>
          </div>
        </section>
      </main>
      <footer class="app-footer">
        <p>当前为 Alpha 版本，仅聚合公开摘要并跳转原站；内容版权归原平台和作者所有。</p>
        <nav class="footer-links" aria-label="政策与条款">
          <a href="./privacy.html">隐私说明</a>
          <a href="./terms.html">使用条款</a>
          <a href="https://www.youtube.com/t/terms" target="_blank" rel="noreferrer">YouTube 条款</a>
          <button id="youtube-consent-revoke" class="footer-button" type="button" hidden>撤回 YouTube 同意</button>
        </nav>
      </footer>
    </div>
  </body>
</html>
